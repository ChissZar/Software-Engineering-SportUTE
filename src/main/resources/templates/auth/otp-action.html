<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <link rel="icon" type="image/png" th:href="@{/images/sporthub-logo-single.png}">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportHub — Đã sao chép mã OTP</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6.5.1 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Auth Stylesheet -->
    <link rel="stylesheet" href="/css/auth.css?v=20261017">
    <style>
        .modal-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 440px;
            padding: 38px 32px;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.92) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: #ecfdf5;
            color: #059669;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 18px;
            border: 2px solid #a7f3d0;
            box-shadow: 0 8px 16px rgba(5, 150, 105, 0.12);
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.55;
            margin-bottom: 20px;
        }

        .otp-highlight-box {
            background: #f0fdf4;
            border: 2px dashed #059669;
            border-radius: 14px;
            padding: 14px 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .otp-digits {
            font-family: 'Courier New', Consolas, monospace;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 6px;
            color: #064e3b;
        }

        .btn-copy-again {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 14px;
            color: #059669;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-copy-again:hover {
            background: #ecfdf5;
            border-color: #059669;
        }

        .guide-box {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 13px;
            color: #334155;
            line-height: 1.55;
            text-align: left;
            margin-bottom: 22px;
        }

        .actions-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action-primary {
            width: 100%;
            padding: 13px 18px;
            border-radius: 12px;
            border: none;
            background: #059669;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-family: inherit;
        }

        .btn-action-primary:hover {
            background: #047857;
            transform: translateY(-1px);
        }

        .btn-action-secondary {
            width: 100%;
            padding: 11px 18px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            color: #64748b;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
        }

        .btn-action-secondary:hover {
            background: #f8fafc;
            color: #1e293b;
        }

        .toast-copied {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #064e3b;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 999;
            border: 1px solid #10b981;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translate(-50%, -10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">

    <div class="bg-backdrop"></div>
    <div class="bg-overlay"></div>

    <div id="toastCopied" class="toast-copied" style="display: none;">
        <i class="fa-solid fa-circle-check" style="color: #6ee7b7;"></i>
        <span>Đã sao chép mã OTP vào bộ nhớ tạm!</span>
    </div>

    <div class="modal-card">
        
        <div class="icon-circle">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>

        <h2 class="modal-title">Đã sao chép mã OTP!</h2>
        <p class="modal-desc">
            Mã OTP 6 chữ số đã được sao chép vào bộ nhớ tạm:
        </p>

        <div class="otp-highlight-box">
            <span id="otpCode" class="otp-digits" th:text="${otp}">805851</span>
            <button type="button" id="btnCopyAgain" class="btn-copy-again" title="Sao chép lại">
                <i class="fa-regular fa-copy"></i>
            </button>
        </div>

        <div class="guide-box">
            <div style="font-weight: 700; color: #064e3b; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-circle-check" style="color: #059669;"></i> Đã gửi tín hiệu tự động
            </div>
            Bạn chỉ cần <strong>chuyển lại tab SportHub đang mở</strong>, hệ thống sẽ tự động nhận diện và điền mã cho bạn!
        </div>

        <div class="actions-column">
            <button type="button" id="btnBackToSportHub" class="btn-action-primary">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Quay lại tab SportHub</span>
            </button>
            <a th:href="${targetVerifyUrl}" style="font-size: 12.5px; color: #64748b; text-decoration: underline; margin-top: 4px; display: inline-block;">
                Tiếp tục tại tab này nếu bạn chưa mở trang xác thực
            </a>
        </div>

    </div>

    <script th:inline="javascript">
        const otpValue = /*[[${otp}]]*/ '';
        const emailValue = /*[[${email}]]*/ '';
        const toast = document.getElementById('toastCopied');

        function showToast() {
            if (!toast) return;
            toast.style.display = 'flex';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }

        function copyOtpToClipboard() {
            if (!otpValue) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(otpValue)
                    .then(() => showToast())
                    .catch(() => {});
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = otpValue;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (e) {}
                document.body.removeChild(textarea);
            }
        }

        function broadcastOtp() {
            if (!otpValue) return;
            try {
                const channel = new BroadcastChannel('sporthub_otp_sync');
                channel.postMessage({ otp: otpValue, email: emailValue });
            } catch (e) {}

            try {
                localStorage.setItem('sporthub_latest_otp', JSON.stringify({
                    otp: otpValue,
                    email: emailValue,
                    timestamp: Date.now()
                }));
            } catch (e) {}
        }

        // Tự động copy & phát sóng tín hiệu
        copyOtpToClipboard();
        broadcastOtp();

        const btnCopyAgain = document.getElementById('btnCopyAgain');
        if (btnCopyAgain) {
            btnCopyAgain.addEventListener('click', () => {
                copyOtpToClipboard();
                broadcastOtp();
            });
        }

        const btnBackToSportHub = document.getElementById('btnBackToSportHub');
        if (btnBackToSportHub) {
            btnBackToSportHub.addEventListener('click', () => {
                try {
                    if (window.opener && !window.opener.closed) {
                        window.opener.focus();
                    }
                } catch(e) {}
                window.close();
            });
        }
    </script>

</body>
</html>
