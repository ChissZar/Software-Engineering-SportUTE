<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportHub - Tạo tài khoản mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #00a651;
            --primary-hover: #008c44;
        }
        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 980px;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            min-height: 600px;
        }
        .auth-banner {
            flex: 1.1;
            background: linear-gradient(135deg, rgba(7, 60, 36, 0.95), rgba(0, 166, 81, 0.85)),
                        url('https://images.unsplash.com/photo-1529900748604-07564a03e7a6?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat;
            color: #ffffff;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-subtitle {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #86efac;
            margin-top: 3px;
        }
        .banner-body h2 {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 15px;
        }
        .banner-body p {
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.6;
        }
        .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
        }
        .auth-form-card {
            flex: 1;
            padding: 40px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .tab-switch {
            background-color: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            display: flex;
            margin-bottom: 25px;
        }
        .tab-switch .tab-btn {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .tab-switch .tab-btn.active {
            background-color: #ffffff;
            color: #0f172a;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 5px;
        }
        .form-control {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            background-color: #f8fafc;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(0, 166, 81, 0.15);
        }
        .btn-submit {
            background-color: var(--primary-green);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
        .text-danger { font-size: 12px; margin-top: 3px; }
    </style>
</head>
<body>

<div class="auth-container">
    <!-- Cột trái: Banner -->
    <div class="auth-banner">
        <div class="banner-header">
            <div class="brand-title">
                <i class="fa-solid fa-shapes"></i> SportHub
            </div>
            <div class="brand-subtitle">PLAY • BOOK • TOGETHER</div>
        </div>
        <div class="banner-body">
            <h2>Vận hành linh hoạt.<br>Lan tỏa tinh thần thể thao.</h2>
            <p>Hệ thống hỗ trợ đặt sân và quản lý tập trung hàng đầu dành cho trung tâm thể thao đa năng.</p>
        </div>
        <div class="banner-footer">
            <span class="badge-tag">
                <span class="badge bg-light text-dark rounded-pill">Kết nối cuộc sống</span>
                • SportHub Management
            </span>
        </div>
    </div>

    <!-- Cột phải: Form Tạo tài khoản (Hình 5-3) -->
    <div class="auth-form-card">
        <!-- Chuyển tab -->
        <div class="tab-switch">
            <a href="/login" class="tab-btn">Đăng nhập</a>
            <a href="/register" class="tab-btn active">Tạo tài khoản</a>
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <!-- Báo lỗi chung -->
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2 fs-6">
                <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
            </div>

            <!-- Họ và tên -->
            <div class="mb-3">
                <label class="form-label" for="fullName">Họ và tên</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                       placeholder="Nguyễn Văn A" required>
                <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <!-- Số điện thoại -->
            <div class="mb-3">
                <label class="form-label" for="phone">Số điện thoại</label>
                <input type="tel" id="phone" th:field="*{phone}" class="form-control"
                       placeholder="0901 234 567" required>
                <div class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <!-- Email liên hệ -->
            <div class="mb-3">
                <label class="form-label" for="email">Email liên hệ</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                       placeholder="name@sporthub.vn" required>
                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <!-- Mật khẩu -->
            <div class="mb-3">
                <label class="form-label" for="password">Mật khẩu</label>
                <input type="password" id="password" th:field="*{password}" class="form-control"
                       placeholder="Tối thiểu 8 ký tự" required>
                <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-submit">Tạo tài khoản mới</button>
        </form>
    </div>
</div>

</body>
</html>
