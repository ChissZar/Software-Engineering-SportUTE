<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar(activeMenu)" class="sidebar-wrapper d-flex flex-column justify-content-between p-3"
     style="width: 250px; min-height: 100vh; background: linear-gradient(180deg, #061f25, #082c2f); color: #fff;">
    <div>
        <!-- Brand -->
        <div class="mb-3 px-1 text-center">
            <div class="p-2 rounded-3 d-flex align-items-center justify-content-center"
                 style="background: linear-gradient(135deg, rgba(255,255,255,.97), rgba(238,251,245,.92)); border: 1px solid rgba(96,243,165,.25); box-shadow: 0 4px 12px rgba(0,0,0,.15); min-height: 60px;">
                <img th:src="@{/images/sporthub-logo.png}" alt="SportHub" class="img-fluid" style="max-height: 44px; object-fit: contain;">
            </div>
        </div>

        <!-- Menu Navigation -->
        <nav class="nav flex-column gap-1">
            <a href="/admin/dashboard" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'dashboard' ? 'active bg-success text-white' : ''}">
                <i class="fa-solid fa-chart-pie"></i> Tổng quan
            </a>
            <a href="/admin/bookings" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'bookings' ? 'active bg-success text-white' : ''}">
                <i class="fa-regular fa-calendar-check"></i> Đặt sân
            </a>
            <a href="/admin/bookings" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'schedule' ? 'active bg-success text-white' : ''}">
                <i class="fa-regular fa-calendar-days"></i> Lịch sân
            </a>
            <a href="/admin/courts" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'courts' ? 'active bg-success text-white' : ''}">
                <i class="fa-solid fa-table-cells-large"></i> Sân thể thao
            </a>
            <a href="/admin/customers" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'customers' ? 'active bg-success text-white' : ''}">
                <i class="fa-solid fa-users"></i> Khách hàng
            </a>
            <a href="/admin/employees" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'employees' ? 'active bg-success text-white' : ''}">
                <i class="fa-solid fa-user-tie"></i> Nhân viên
            </a>
            <a href="/admin/payments" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'payments' ? 'active bg-success text-white' : ''}">
                <i class="fa-solid fa-receipt"></i> Thanh toán
            </a>
            <a href="/admin/promotions" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'promotions' ? 'active bg-success text-white' : ''}">
                <i class="fa-solid fa-tags"></i> Khuyến mãi
            </a>
            <a href="/admin/maintenance" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'maintenance' ? 'active bg-success text-white' : ''}">
                <i class="fa-solid fa-wrench"></i> Bảo trì
            </a>
            <a href="/admin/reports" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'reports' ? 'active bg-success text-white' : ''}">
                <i class="fa-solid fa-chart-line"></i> Báo cáo
            </a>
            <a href="/admin/permissions" class="nav-link text-white-50 px-3 py-2 rounded-3 d-flex align-items-center gap-3"
               th:classappend="${activeMenu == 'permissions' ? 'active bg-success text-white' : ''}">
                <i class="fa-solid fa-shield-halved"></i> Phân quyền (RBAC)
            </a>
        </nav>
    </div>

    <!-- User / Logout -->
    <div class="border-top border-secondary pt-3 px-2">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle bg-success d-flex align-items-center justify-content-center text-white fw-bold"
                     style="width: 36px; height: 36px;">QL</div>
                <div>
                    <div class="fw-semibold text-white" style="font-size: 13px;">Quản lý trung tâm</div>
                    <div class="text-white-50" style="font-size: 11px;">Quản trị viên</div>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-link text-danger p-0">
                    <i class="fa-solid fa-arrow-right-from-bracket fs-5"></i>
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
