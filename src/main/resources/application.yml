spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=QuanLySanTheThao;encrypt=true;trustServerCertificate=true;characterEncoding=UTF-8
    username: sa
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        default_schema: dbo
server:
  port: ${PORT:8080}
# JWT va Cloudinary chua duoc noi vao runtime.
# trustServerCertificate=true chi danh cho SQL Server local.
